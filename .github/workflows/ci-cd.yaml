name: CI-CD Pipeline
on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Get changed files
        id: changed-files-build
        uses: tj-actions/changed-files@v47
        with:
          files: |
            Dockerfile
            requirements.txt

      - name: Setup Docker Buildx
        if: steps.changed-files-build.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to dockerhub
        if: steps.changed-files-build.outputs.any_changed == 'true'|| github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push docker image 
        if: steps.changed-files-build.outputs.any_changed == 'true'|| github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
             ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
             ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

  unit-integration-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      POSTGRES_CONN_USERNAME: ${{ vars.POSTGRES_CONN_USERNAME }}
      POSTGRES_CONN_HOST: ${{ vars.POSTGRES_CONN_HOST }}
      POSTGRES_CONN_PORT: ${{ vars.POSTGRES_CONN_PORT }}
      POSTGRES_CONN_PASSWORD: ${{ secrets.POSTGRES_CONN_PASSWORD }}

      METADATA_DATABASE_NAME: ${{ vars.METADATA_DATABASE_NAME }}
      METADATA_DATABASE_USERNAME: ${{ vars.METADATA_DATABASE_USERNAME }}
      METADATA_DATABASE_PASSWORD: ${{ secrets.METADATA_DATABASE_PASSWORD }}

      CELERY_BACKEND_NAME: ${{ vars.CELERY_BACKEND_NAME }}
      CELERY_BACKEND_USERNAME: ${{ vars.CELERY_BACKEND_USERNAME }}
      CELERY_BACKEND_PASSWORD: ${{ secrets.CELERY_BACKEND_PASSWORD }}

      ELT_DATABASE_NAME: ${{ vars.ELT_DATABASE_NAME }}
      ELT_DATABASE_USERNAME: ${{ vars.ELT_DATABASE_USERNAME }}
      ELT_DATABASE_PASSWORD: ${{ secrets.ELT_DATABASE_PASSWORD }}

      AIRFLOW_UID: ${{ vars.AIRFLOW_UID }}
      _AIRFLOW_WWW_USER_USERNAME: ${{ vars._AIRFLOW_WWW_USER_USERNAME }}
      _AIRFLOW_WWW_USER_PASSWORD: ${{ secrets._AIRFLOW_WWW_USER_PASSWORD }}

      YOUTUBE_CHANNEL_HANDLE: ${{ vars.YOUTUBE_CHANNEL_HANDLE }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Get changed files
        id: changed-files-tests
        uses: tj-actions/changed-files@v47
        with:
          files: |
            dags/**
            include/**
            docker-compose.yaml

      - name: Start Airflow using docker compose
        if: steps.changed-files-tests.outputs.any_changed == 'true'|| github.event_name == 'workflow_dispatch'
        run: docker compose up -d

      - name: Run unit and integration tests
        if: steps.changed-files-tests.outputs.any_changed == 'true'|| github.event_name == 'workflow_dispatch'
        run: docker exec -t -e PYTHONPATH=dags/ airflow-apiserver sh -c "pytest -v tests/"

      - name: Run E2E tests
        if: steps.changed-files-tests.outputs.any_changed == 'true'|| github.event_name == 'workflow_dispatch'
        run: |
          DAG_NAMES=("produce_json" "update_db" "quality_check")

          for DAG in "${DAG_NAMES[@]}"; do
            docker exec -t airflow-apiserver sh -c "airflow dags test $DAG"
          done

      - name: Tear down docker compose
        if: steps.changed-files-tests.outputs.any_changed == 'true'|| github.event_name == 'workflow_dispatch'
        run: docker compose down --volumes --remove-orphans


